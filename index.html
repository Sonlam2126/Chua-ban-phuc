
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chùa Bản Phúc - Ngôi chùa online</title>

<style>
* { box-sizing:border-box; }
body {
 margin:0;
 background:#160b08;
 color:#ffe4a8;
 font-family:Arial,sans-serif;
 text-align:center;
}
header {
 padding:18px 8px;
 background:linear-gradient(#54250d,#1b0b07);
 border-bottom:2px solid #b88936;
}
h1 { color:#ffd66d; margin:5px; }
.subtitle { font-size:14px; }
#altar {
 width:100%;
 height:65vh;
 min-height:380px;
 display:block;
}
button {
 border:1px solid #ffd477;
 border-radius:12px;
 background:#9e571c;
 color:white;
 padding:13px 18px;
 margin:7px;
 font-size:16px;
}
button:active { background:#d18c32; }
#message {
 min-height:28px;
 padding:8px;
 color:#ffe3a4;
}
footer {
 padding:20px;
 font-size:13px;
 color:#c9a978;
}
</style>
</head>

<body>
<header>
<h1>🙏 CHÙA BAN PHÚC 🙏</h1>
<div class="subtitle">
Không gian tâm linh - Cầu bình an và phước lành
</div>
</header>

<div id="altar"></div>

<div>
<button id="incense">🪔 Thắp hương</button>
<button id="flower">🪷 Dâng hoa sen</button>
<button id="pray">🙏 Thành tâm lễ Phật</button>
</div>

<p id="message">Kính chúc mọi người thân tâm an lạc.</p>

<footer>
CHÙA BAN PHÚC ONLINE<br>
Nguyện cầu quốc thái dân an - Nhà nhà bình an
</footer>

<script type="importmap">
{
 "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const container=document.getElementById('altar');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x160b08);

const camera=new THREE.PerspectiveCamera(
 40,container.clientWidth/container.clientHeight,0.1,100
);
camera.position.set(0,4.3,11);
camera.lookAt(0,2.1,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.5));

const light=new THREE.PointLight(0xffc35b,100,30);
light.position.set(0,6,4);
scene.add(light);

const gold=new THREE.MeshStandardMaterial({
 color:0xe6b94e,metalness:0.55,roughness:0.3
});
const darkGold=new THREE.MeshStandardMaterial({
 color:0x95601c,metalness:0.5,roughness:0.4
});
const pink=new THREE.MeshStandardMaterial({
 color:0xf18eaf,roughness:0.4
});
const wood=new THREE.MeshStandardMaterial({
 color:0x713512,roughness:0.35
});

function shape(geometry,material,x,y,z,sx=1,sy=1,sz=1){
 const m=new THREE.Mesh(geometry,material);
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function sphere(x,y,z,sx,sy,sz,mat){
 return shape(new THREE.SphereGeometry(1,32,24),
 mat,x,y,z,sx,sy,sz);
}
function cube(x,y,z,sx,sy,sz,mat){
 return shape(new THREE.BoxGeometry(sx,sy,sz),
 mat,x,y,z,1,1,1);
}

// BÀN THỜ
cube(0,0.5,0,7,0.5,2.3,wood);
cube(0,0.85,0,6.5,0.2,2,darkGold);
cube(0,1.15,0,5.6,0.5,1.5,wood);
cube(0,1.43,0,5.8,0.12,1.7,gold);

// BỆ SEN
sphere(0,1.75,0,1.3,0.28,0.85,darkGold);

// TƯỢNG PHẬT 3D DẠNG MÔ HÌNH
const buddha=new THREE.Group();
scene.add(buddha);

function part(g,m,x,y,z,sx=1,sy=1,sz=1){
 const o=new THREE.Mesh(g,m);
 o.position.set(x,y,z);
 o.scale.set(sx,sy,sz);
 buddha.add(o);
 return o;
}

// Thân và đầu
part(new THREE.SphereGeometry(1,32,32),gold,0,2.65,0,0.68,0.9,0.48);
part(new THREE.SphereGeometry(1,32,32),gold,0,3.68,0,0.43,0.48,0.4);

// Hai chân ngồi thiền
part(new THREE.SphereGeometry(1,32,24),gold,-0.42,2.05,0.15,0.7,0.27,0.5);
part(new THREE.SphereGeometry(1,32,24),gold,0.42,2.05,0.15,0.7,0.27,0.5);

// Hai tay
part(new THREE.SphereGeometry(1,24,24),gold,-0.52,2.6,0.25,0.18,0.5,0.2);
part(new THREE.SphereGeometry(1,24,24),gold,0.52,2.6,0.25,0.18,0.5,0.2);

// Tai
part(new THREE.SphereGeometry(1,24,24),gold,-0.46,3.65,0,0.1,0.25,0.12);
part(new THREE.SphereGeometry(1,24,24),gold,0.46,3.65,0,0.1,0.25,0.12);

// Tóc và nhục kế
part(new THREE.SphereGeometry(1,24,24),darkGold,0,4.12,0,0.13,0.17,0.13);

// Mắt và nét mặt
const face=new THREE.MeshStandardMaterial({color:0x704319});
part(new THREE.SphereGeometry(1,16,16),face,-0.16,3.72,0.365,0.035,0.018,0.012);
part(new THREE.SphereGeometry(1,16,16),face,0.16,3.72,0.365,0.035,0.018,0.012);

// Hào quang
const halo=new THREE.Mesh(
 new THREE.TorusGeometry(0.85,0.055,16,80),gold
);
halo.position.set(0,3.65,-0.45);
scene.add(halo);

// HOA SEN HAI BÊN
function lotus(x){
 sphere(x,1.8,0,0.28,0.13,0.28,gold);
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const p=sphere(
   x+Math.cos(a)*0.25,
   1.85,
   Math.sin(a)*0.25,
   0.13,0.3,0.1,pink
  );
  p.rotation.z=-Math.cos(a)*0.45;
  p.rotation.x=Math.sin(a)*0.45;
 }
}
lotus(-2.3);
lotus(2.3);

// LỌ HOA VÀ NẾN
for(const x of [-2.7,2.7]){
 sphere(x,1.5,0,0.24,0.4,0.22,darkGold);
 sphere(x,2.15,0,0.12,0.22,0.12,gold);
}

// KHÓI HƯƠNG
const smoke=[];
for(let i=0;i<35;i++){
 const mat=new THREE.SpriteMaterial({
  color:0xffffff,transparent:true,opacity:0
 });
 const s=new THREE.Sprite(mat);
 s.position.set(0,2.2,0.7);
 s.scale.set(0.3,0.3,1);
 scene.add(s);
 smoke.push(s);
}

// NGỌN LỬA
const flames=[];
for(let i=-1;i<=1;i++){
 const f=shape(
  new THREE.ConeGeometry(0.07,0.22,16),
  new THREE.MeshBasicMaterial({color:0xffa329}),
  i*0.13,2.45,0.7
 );
 f.visible=false;
 flames.push(f);
}

let lit=false;
let t=0;

document.getElementById('incense').onclick=()=>{
 lit=true;
 flames.forEach(f=>f.visible=true);
 document.getElementById('message').innerText=
 '🙏 Bạn đã thành tâm dâng hương tại Chùa Bản Phúc.';
};

document.getElementById('flower').onclick=()=>{
 document.getElementById('message').innerText=
 '🪷 Xin dâng hoa sen thanh khiết lên Đức Phật.';
};

document.getElementById('pray').onclick=()=>{
 document.getElementById('message').innerText=
 '🙏 Nguyện cầu mọi người thân tâm an lạc, gia đình hạnh phúc.';
};

function animate(){
 requestAnimationFrame(animate);
 t+=0.016;

 smoke.forEach((s,i)=>{
  const phase=(t*0.4+i/35)%1;
  s.position.set(
   Math.sin(t*1.5+i)*0.13,
   2.5+phase*2.5,
   0.7
  );
  s.scale.setScalar(0.15+phase*0.45);
  s.material.opacity=lit?Math.sin(phase*Math.PI)*0.4:0;
 });

 flames.forEach((f,i)=>{
  f.scale.y=0.8+Math.sin(t*9+i)*0.25;
 });

 halo.rotation.z=Math.sin(t*0.3)*0.02;
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 const w=container.clientWidth;
 const h=container.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
});
</script>
</body>
</html>
